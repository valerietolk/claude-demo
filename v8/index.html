<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Claude · ликбез</title>
<meta name="theme-color" content="#FF7645">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;600;700&display=swap" rel="stylesheet">
<style>
@font-face{
  font-family:"LORE Cyrillic";
  src:url("../fonts/LORE-Cyrillic.woff2") format("woff2"), url("../fonts/LORE-Cyrillic.woff") format("woff");
  font-display:swap;
}
:root{
  --ink:#1f0d04;
  /* весь текст — одним цветом (так проще править) */
  --ink-soft:var(--ink);
  --ink-faint:var(--ink);
  --rule:rgba(31,13,4,.16);
  --glass:rgba(255,236,214,.26);
  --orange:#FF7645;
  --amber:#FDBC57;
  --ease-out:cubic-bezier(.16,1,.3,1);
}
*{ box-sizing:border-box; margin:0; padding:0; }
html{ -webkit-text-size-adjust:100%; }
body{
  min-height:100vh;
  background:var(--orange);
  color:var(--ink);
  font-family:Inter, "Helvetica Neue", Helvetica, Arial, sans-serif;
  font-weight:300;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  overflow-x:hidden;
}

/* ---------- пространство: тёплый свет сверху, глубина к краям ---------- */
.stage{ position:fixed; inset:0; z-index:0; overflow:hidden;
  --c1:#FDBC57; --c2:#FF8A4A; --c3:#FF7645; --c4:rgba(232,84,40,.55);
  background:
    radial-gradient(70% 55% at 50% 30%, var(--c1) 0%, transparent 70%),
    radial-gradient(120% 90% at 50% 110%, var(--c4) 0%, transparent 60%),
    linear-gradient(180deg, var(--c1) 0%, var(--c2) 45%, var(--c3) 100%);
}
.stage canvas{ position:absolute; inset:0; width:100%; height:100%; display:block; opacity:0; transition:opacity 1.2s var(--ease-out); }
.stage canvas.on{ opacity:1; }
/* лёгкое зерно, чтобы градиент не был «пластиковым» */
.stage::after{
  content:""; position:absolute; inset:-50%; opacity:.08; mix-blend-mode:multiply; pointer-events:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='140' height='140' filter='url(%23n)' opacity='.6'/></svg>");
}

/* ---------- первый экран: только логотип ---------- */
.hero{ position:relative; z-index:2; height:100vh; height:100svh; display:grid; place-items:center; pointer-events:none; }
.hero img{ width:min(403px, 72vw); height:auto; filter:drop-shadow(0 6px 30px rgba(120,40,0,.25)); }

/* ---------- контент глав ---------- */
.content{ position:relative; z-index:2; padding:8vh 0 30vh; }
.chapter{
  width:min(640px, calc(100% - 32px));
  margin:0 0 0 clamp(16px, 9vw, 150px);
  padding:16vh 0 4vh;
}
.chapter + .chapter{ border-top:1px solid var(--rule); }
.num{ display:block; margin-bottom:22px; font-size:13px; font-weight:400; letter-spacing:.06em; color:var(--ink-faint); }

.doc h1{ overflow-wrap:break-word; font-weight:700; font-size:clamp(44px, 6vw, 84px); line-height:.98; letter-spacing:-.04em; text-wrap:balance; }
.doc h2{ margin-top:22px; font-weight:700; font-size:clamp(19px, 1.7vw, 24px); line-height:1.35; letter-spacing:-.015em; color:var(--ink-soft); text-wrap:balance; }
.doc h3{ margin-top:clamp(56px, 9vh, 96px); padding-top:22px; border-top:1px solid var(--rule); font-weight:700; font-size:clamp(26px, 3vw, 40px); line-height:1.08; letter-spacing:-.03em; text-wrap:balance; }
.doc h4{ margin-top:40px; font-weight:700; font-size:clamp(18px, 1.5vw, 21px); line-height:1.3; letter-spacing:-.014em; }
.doc p, .doc li, .doc td, .doc th{ font-size:clamp(16px, 1.2vw, 18px); line-height:1.6; letter-spacing:-.006em; text-wrap:pretty; }
.doc > * + *, .doc .card > * + *{ margin-top:14px; }
.doc h1 + *{ margin-top:22px; }
.doc h3 + *, .doc h4 + *{ margin-top:12px; }
.doc strong{ font-weight:400; }
.doc b.key{ font-weight:600; }
.doc a{ color:inherit; text-underline-offset:3px; }
.doc s{ color:var(--ink-faint); }
.doc s.lore{ font-family:"LORE Cyrillic", Inter, sans-serif; font-size:1.05em; color:var(--ink); text-decoration-color:var(--ink); }
.doc ul, .doc ol{ padding-left:1.2em; }
.doc li + li{ margin-top:6px; }
.doc li::marker{ color:var(--ink-faint); }
.doc blockquote{ padding:14px 18px; border-radius:16px; background:var(--glass); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px); }
.doc blockquote p{ font-size:clamp(15px, 1.1vw, 17px); }
.doc .tag{ display:inline-block; margin-left:6px; padding:0 9px; border-radius:999px; box-shadow:inset 0 0 0 1px var(--rule); font-size:12px; line-height:1.8; color:var(--ink-soft); white-space:nowrap; vertical-align:2px; }
.doc .fact, .doc .warn, .doc .note{ padding-left:16px; border-left:2px solid var(--ink); }
.doc .note, .doc .when-not, .doc .aside{ color:var(--ink-soft); }
.doc aside.draft, .doc p.draft{ display:block; padding:12px 16px; border-radius:12px; border:1px dashed var(--ink-faint); color:var(--ink-soft); font-size:14px; font-style:italic; }
.doc aside.draft::before{ content:"черновик · "; font-style:normal; font-weight:400; }
.doc .draft-inline{ color:var(--ink-soft); font-style:italic; }
.doc .cards, .doc .groups{ display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:10px; }
.doc .card, .doc .groups > div{ padding:20px; border-radius:18px; background:var(--glass); -webkit-backdrop-filter:blur(16px); backdrop-filter:blur(16px); }
.doc .card h3, .doc .card h4{ margin:0; padding:0; border:0; font-size:22px; font-weight:700; letter-spacing:-.02em; }
.doc .card p, .doc .card li{ font-size:15px; }
.doc .groups b{ display:block; margin-bottom:6px; }
.doc .compare{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.doc .compare > div{ padding:16px 18px; border-radius:16px; background:var(--glass); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px); font-size:16px; line-height:1.55; }
.doc .compare .good{ box-shadow:inset 0 0 0 1.5px var(--ink); }
.doc .template{ border-top:1px solid var(--rule); }
.doc .template > div{ padding:10px 0; border-bottom:1px solid var(--rule); font-size:16px; }
.doc .table-wrap{ overflow-x:auto; }
.doc table{ width:100%; border-collapse:collapse; }
.doc th, .doc td{ padding:12px 16px 12px 0; text-align:left; vertical-align:top; border-top:1px solid var(--rule); }
.doc th{ border-top:0; font-size:12.5px; letter-spacing:.045em; color:var(--ink-soft); font-weight:400; }
.doc .versions{ margin-top:22px; }
.doc .thanks{ min-height:50vh; display:grid; place-content:center; text-align:center; }
.doc .thanks__title{ font-size:clamp(72px, 12vw, 180px); }
.doc .thanks__note{ color:var(--ink-soft); }

/* ---------- навигация справа: стеклянная капсула с точками и «жидкой» каплей текущей главы ---------- */
:root{ --accent:#E8501C; }
.rail{ position:fixed; z-index:20; right:clamp(14px, 2.2vw, 36px); top:50%; transform:translateY(-50%);
  display:flex; flex-direction:column; align-items:center; gap:10px;
  opacity:0; pointer-events:none; transition:opacity .6s var(--ease-out); }
.rail.on{ opacity:1; pointer-events:auto; }
.glass{ background:rgba(255,255,255,.3); -webkit-backdrop-filter:blur(18px) saturate(1.5); backdrop-filter:blur(18px) saturate(1.5);
  box-shadow:inset 0 0 0 .5px rgba(255,255,255,.7), inset 0 1px 0 rgba(255,255,255,.6), 0 8px 24px rgba(0,0,0,.07); }
.burger{ width:34px; height:34px; border:0; border-radius:50%; cursor:pointer; color:var(--ink); display:grid; place-items:center;
  transition:transform .3s var(--ease-out), background .3s; }
.burger:hover{ transform:scale(1.06); background:rgba(255,255,255,.45); }
.burger svg{ width:14px; height:14px; }
.pill{ position:relative; padding:7px 0; border-radius:999px; width:24px; }
.dots{ list-style:none; display:flex; flex-direction:column; align-items:center; }
.dot{ position:relative; display:grid; place-items:center; width:24px; height:18px; border:0; background:none; cursor:pointer; }
.dot::before{ content:""; width:6px; height:6px; border-radius:50%; background:rgba(31,13,4,.26); transition:background .3s, transform .3s var(--ease-out); }
.dot:hover::before{ background:rgba(31,13,4,.5); transform:scale(1.2); }
.dot span{ position:absolute; right:34px; top:50%; transform:translate(4px,-50%); white-space:nowrap; font:400 13px/1 Inter, sans-serif; color:var(--ink);
  padding:7px 11px; border-radius:999px; opacity:0; pointer-events:none; transition:opacity .25s, transform .25s var(--ease-out); }
.dot:hover span, .dot:focus-visible span{ opacity:1; transform:translate(0,-50%); }
/* капля: тянется от точки к точке и догоняет сама себя, как жидкость */
.drop{ position:absolute; left:50%; top:0; width:8px; height:8px; margin-left:-4px; border-radius:999px; pointer-events:none;
  background:var(--accent); box-shadow:0 0 0 2px rgba(255,255,255,.55), 0 2px 8px rgba(0,0,0,.18); will-change:transform,height; }
.toc{ position:fixed; z-index:30; right:clamp(14px, 2.2vw, 36px); top:50%; width:min(340px, calc(100vw - 28px)); max-height:80vh; overflow:auto;
  transform:translate(8px,-50%) scale(.98); transform-origin:right center; opacity:0; visibility:hidden;
  padding:10px; border-radius:24px; background:rgba(255,255,255,.5); -webkit-backdrop-filter:blur(26px) saturate(1.6); backdrop-filter:blur(26px) saturate(1.6);
  box-shadow:0 24px 60px rgba(0,0,0,.12), inset 0 0 0 .5px rgba(255,255,255,.8);
  transition:opacity .35s var(--ease-out), transform .35s var(--ease-out), visibility 0s .35s; }
.toc.is-open{ opacity:1; visibility:visible; transform:translate(0,-50%); transition:opacity .35s var(--ease-out), transform .35s var(--ease-out); }
.toc ol{ list-style:none; }
.toc button{ display:flex; gap:12px; align-items:baseline; width:100%; padding:9px 12px; border:0; border-radius:14px; background:none; cursor:pointer; text-align:left;
  font:400 15px/1.3 Inter, sans-serif; color:var(--ink); transition:background .2s; }
.toc button:hover{ background:rgba(255,255,255,.55); }
.toc button.is-active{ font-weight:700; background:rgba(255,255,255,.7); }
.toc small{ font-size:12px; min-width:20px; }

@media (max-width: 760px){
  .rail{ right:6px; gap:8px; }
  .burger{ width:30px; height:30px; }
  .pill{ width:20px; padding:5px 0; }
  .dot{ width:20px; height:15px; }
  .dot span{ display:none; }
  .toc{ right:14px; }
  .chapter{ width:calc(100% - 52px); margin:0 0 0 16px; padding-top:12vh; }
  .doc .compare{ grid-template-columns:1fr; }
}
@media (prefers-reduced-motion: reduce){
  .stage canvas{ transition:none; }
}
</style>
</head>
<body>

<div class="stage"><canvas id="gl" aria-hidden="true"></canvas></div>

<header class="hero">
  <img src="claude-logo.svg" alt="Claude" width="403" height="87">
</header>

<main class="content" id="content"></main>

<nav class="rail" id="rail" aria-label="Главы">
  <button class="burger glass" id="burger" type="button" aria-label="Содержание" aria-expanded="false">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2 4h12M2 8h12M2 12h12"/></svg>
  </button>
  <div class="pill glass"><ol class="dots" id="dots"></ol><i class="drop" id="drop"></i></div>
</nav>
<div class="toc" id="toc" role="dialog" aria-label="Содержание"><ol id="tocList"></ol></div>

<script src="../vendor/marked.min.js"></script>
<script src="../vendor/three.min.js"></script>
<script src="figures.js"></script>
<script>
(function(){
  "use strict";

  // Главы — те же файлы, что и в основной версии. Текст не меняем.
  var FILES = [
    "../content/01-likbez.md", "../content/02-where.md", "../content/03-chrome.md", "../content/04-design.md",
    "../content/05-code.md", "../content/06-connectors.md", "../content/07-skills.md", "../content/08-limits.md",
    "../content/09-task.md", "../content/10-inspiration.md", "../content/11-personal.md", "../content/12-thanks.md"
  ];
  var gl = document.getElementById("gl"), content = document.getElementById("content");
  var pad = function(n){ return String(n).padStart(2, "0"); };
  function clamp(v, a, b){ return Math.min(b, Math.max(a, v)); }
  function smooth(t){ return t * t * (3 - 2 * t); }
  function esc(t){ return t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
  function ramp(p, a, b){ return smooth(clamp((p - a) / (b - a), 0, 1)); }

  // эмодзи в презентации не показываем; сами тексты глав не меняем
  var EMOJI = /(?:\p{Extended_Pictographic}|\p{Regional_Indicator})(?:\uFE0F|\u200D(?:\p{Extended_Pictographic})\uFE0F?)*\s?/gu;
  function stripEmoji(root){
    var w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT), n, list = [];
    while ((n = w.nextNode())) list.push(n);
    list.forEach(function(t){ var v = t.nodeValue.replace(EMOJI, "").replace(/\uFE0F/g, ""); if (v !== t.nodeValue) t.nodeValue = v; });
  }

  function render(md){
    md.forEach(function(text, i){
      var sec = document.createElement("section");
      sec.className = "chapter";
      var doc = document.createElement("article");
      doc.className = "doc";
      doc.innerHTML = marked.parse(text || "");
      // длинные заголовки вида «chat/chrome/design/code» переносим по косой черте, а не посреди слова
      doc.querySelectorAll("h1").forEach(function(h){
        if (h.children.length === 0 && h.textContent.indexOf("/") >= 0) h.innerHTML = h.textContent.split("/").map(esc).join("/<wbr>");
      });
      stripEmoji(doc);
      doc.querySelectorAll("table").forEach(function(t){ var w = document.createElement("div"); w.className = "table-wrap"; t.parentNode.replaceChild(w, t); w.appendChild(t); });
      doc.querySelectorAll("a[href^='http']").forEach(function(a){ a.target = "_blank"; a.rel = "noopener"; });
      var num = document.createElement("span");
      num.className = "num";
      num.textContent = pad(i + 1) + " / " + pad(FILES.length);
      sec.appendChild(num);
      sec.appendChild(doc);
      content.appendChild(sec);
    });
  }

  // ---------- навигация: точки + содержание ----------
  var rail = document.getElementById("rail"), dots = document.getElementById("dots");
  var toc = document.getElementById("toc"), tocList = document.getElementById("tocList"), burger = document.getElementById("burger");
  var sections = [], active = -1;
  function buildNav(){
    sections = [].slice.call(content.querySelectorAll(".chapter"));
    sections.forEach(function(sec, i){
      var h1 = sec.querySelector("h1"), title = h1 ? h1.textContent.trim() : "Глава " + (i + 1);
      var li = document.createElement("li"), b = document.createElement("button");
      b.type = "button"; b.className = "dot"; b.setAttribute("aria-label", title);
      b.innerHTML = '<span class="glass">' + esc(title) + "</span>";
      b.addEventListener("click", function(){ go(i); });
      li.appendChild(b); dots.appendChild(li);
      var tl = document.createElement("li"), tb = document.createElement("button");
      tb.type = "button";
      tb.innerHTML = "<small>" + pad(i + 1) + "</small><span>" + esc(title) + "</span>";
      tb.addEventListener("click", function(){ closeToc(); go(i); });
      tl.appendChild(tb); tocList.appendChild(tl);
    });
  }
  function go(i){ window.scrollTo({ top: sections[i].offsetTop + 2, behavior: "smooth" }); }
  function openToc(){ toc.classList.add("is-open"); burger.setAttribute("aria-expanded", "true"); }
  function closeToc(){ toc.classList.remove("is-open"); burger.setAttribute("aria-expanded", "false"); }
  burger.addEventListener("click", function(e){ e.stopPropagation(); toc.classList.contains("is-open") ? closeToc() : openToc(); });
  document.addEventListener("click", function(e){ if (!toc.contains(e.target)) closeToc(); });
  document.addEventListener("keydown", function(e){ if (e.key === "Escape") closeToc(); });
  var drop = document.getElementById("drop"), head = -1, tail = -1;
  function stepDrop(dt){
    if (active < 0 || !dots.children.length) return;
    var b = dots.children[active].firstChild, target = b.offsetTop + b.offsetHeight / 2;
    if (head < 0){ head = tail = target; }
    head += (target - head) * (1 - Math.exp(-dt * 16));   // голова быстрая
    tail += (target - tail) * (1 - Math.exp(-dt * 5));    // хвост тянется следом
    var top = Math.min(head, tail), len = Math.abs(head - tail);
    var w = 8 - Math.min(2.5, len * 0.05);                 // вытягиваясь, капля становится тоньше
    drop.style.height = (len + w) + "px";
    drop.style.width = w + "px"; drop.style.marginLeft = (-w / 2) + "px";
    drop.style.transform = "translateY(" + (top - w / 2) + "px)";
  }
  function markNav(y){
    rail.classList.toggle("on", y > innerHeight * 0.6);
    var cur = 0;
    for (var i = 0; i < sections.length; i++) if (sections[i].offsetTop <= y + innerHeight * 0.4) cur = i;
    if (cur === active) return;
    active = cur;
    [].forEach.call(dots.children, function(li, k){ li.firstChild.classList.toggle("is-active", k === cur); });
    [].forEach.call(tocList.children, function(li, k){ li.firstChild.classList.toggle("is-active", k === cur); });
  }

  // ---------- палитры: у каждой фигуры свой фон ----------
  var PALETTES = [
    { bg: ["#FDBC57", "#FF8A4A", "#FF7645", "rgba(232,84,40,.55)"], bounce: "#C8502A", accent: "#E8501C" },   // оранжевый — оранжевая «звезда» с золотыми искрами
    { bg: ["#EFE9FF", "#C6B8FF", "#A28FFF", "rgba(110,80,240,.40)"], bounce: "#7A62E8", accent: "#5B43F0" },  // лиловый — сине-лаймовая «гантель»
    { bg: ["#F3FFD2", "#D5F48A", "#B5E752", "rgba(120,190,20,.40)"], bounce: "#8CC23A", accent: "#4C8A0E" }   // лайм — сиреневое «облако»
  ];
  // откуда фигура въезжает (мировые единицы): первая уже на месте, вторая справа, третья снизу
  var ENTRY = [[0, 0, 0], [8, 0.5, 0], [0, -6.5, 0]];
  function rgba(c){
    if (c[0] === "#") return [parseInt(c.substr(1, 2), 16), parseInt(c.substr(3, 2), 16), parseInt(c.substr(5, 2), 16), 1];
    var m = c.match(/[\d.]+/g); return [+m[0], +m[1], +m[2], +m[3]];
  }
  function mix(a, b, k){ var x = rgba(a), y = rgba(b); return [0, 1, 2, 3].map(function(i){ return x[i] + (y[i] - x[i]) * k; }); }
  function css(v){ return "rgba(" + Math.round(v[0]) + "," + Math.round(v[1]) + "," + Math.round(v[2]) + "," + v[3].toFixed(3) + ")"; }
  function hex(v){ return "#" + [0, 1, 2].map(function(i){ return ("0" + Math.round(v[i]).toString(16)).slice(-2); }).join(""); }
  var stage = document.querySelector(".stage"), theme = document.querySelector('meta[name="theme-color"]'), lastPal = "";
  function applyPalette(k, blend){
    var a = PALETTES[k], b = PALETTES[Math.min(k + 1, PALETTES.length - 1)];
    var key = k + ":" + blend.toFixed(3);
    if (key === lastPal) return;
    lastPal = key;
    for (var i = 0; i < 4; i++) stage.style.setProperty("--c" + (i + 1), css(mix(a.bg[i], b.bg[i], blend)));
    theme.setAttribute("content", hex(mix(a.bg[2], b.bg[2], blend)));
    document.documentElement.style.setProperty("--accent", hex(mix(a.accent, b.accent, blend)));
    FIG.bounce(hex(mix(a.bounce, b.bounce, blend)));
  }

  // ---------- прокрутка: три фигуры, у каждой свой отрезок из четырёх глав ----------
  // Внутри отрезка прокрутка медленно поворачивает фигуру в «комнате» со светом;
  // в конце она уезжает, а следующая въезжает с другой стороны, пока меняется фон.
  var PER = 4;
  var CYCLES = 3;
  var ready = false, progress = 0, gAt = 0, gSeek = 0, last = performance.now();
  function readScroll(){
    var max = document.documentElement.scrollHeight - innerHeight, y = pageYOffset;
    progress = max > 0 ? clamp(y / max, 0, 1) : 0;
    if (!sections.length){ gAt = 0; return; }
    var starts = [0];
    for (var k = 1; k < CYCLES; k++) starts.push(sections[k * PER].offsetTop);
    starts.push(Math.max(max, starts[starts.length - 1] + 1));
    k = 0;
    while (k < CYCLES - 1 && y >= starts[k + 1]) k++;
    gAt = k + clamp((y - starts[k]) / Math.max(1, starts[k + 1] - starts[k]), 0, 1);
    markNav(y);
  }
  function frame(now){
    var dt = Math.min(0.1, (now - last) / 1000); last = now;
    if (ready){
      gSeek += (gAt - gSeek) * (1 - Math.exp(-dt * 6));   // мягко догоняем, без рывков
      var k = Math.min(CYCLES - 1, Math.floor(gSeek)), c = clamp(gSeek - k, 0, 1);
      if (gSeek >= CYCLES){ k = CYCLES - 1; c = 1; }
      var e = ENTRY[k], n = k < CYCLES - 1 ? ENTRY[k + 1] : [0, 0, 0];
      var inK = 1 - ramp(c, 0, 0.1), outK = ramp(c, 0.92, 1);
      FIG.place(e[0] * inK - n[0] * outK, e[1] * inK - n[1] * outK, 0);
      applyPalette(k, k < CYCLES - 1 ? ramp(c, 0.88, 1) : 0);
      // первый экран: фигура крупно за логотипом; дальше отходит вправо, освобождая место тексту
      var past = ramp(pageYOffset / innerHeight, 0.2, 1);
      var wide = innerWidth > 900;
      FIG.shift(wide ? 0.2 * past : 0);
      gl.style.opacity = wide ? "" : String(1 - 0.55 * past);
      FIG.render(k, c, dt, 1 - 0.12 * (1 - past));
      stepDrop(dt);
    }
    requestAnimationFrame(frame);
  }
  window.addEventListener("scroll", readScroll, { passive: true });
  window.addEventListener("resize", readScroll);
  window.addEventListener("pointermove", function(e){
    if (ready) FIG.mouse(e.clientX / innerWidth * 2 - 1, e.clientY / innerHeight * 2 - 1);
  }, { passive: true });

  try { FIG.init(gl); ready = true; requestAnimationFrame(function(){ gl.classList.add("on"); }); }
  catch (e) { console.error(e); }

  Promise.all(FILES.map(function(f){
    return fetch(f).then(function(r){ return r.ok ? r.text() : ""; }).catch(function(){ return ""; });
  })).then(function(md){ render(md); buildNav(); readScroll(); gSeek = gAt; });

  readScroll();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
