<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Claude · ликбез</title>
<meta name="theme-color" content="#FF7645">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;600;700&display=swap" rel="stylesheet">
<style>
@font-face{
  font-family:"LORE Cyrillic";
  src:url("../fonts/LORE-Cyrillic.woff2") format("woff2"), url("../fonts/LORE-Cyrillic.woff") format("woff");
  font-display:swap;
}
:root{
  --ink:#0B0F19;
  /* весь текст — одним цветом (так проще править) */
  --ink-soft:var(--ink);
  --ink-faint:var(--ink);
  --rule:rgba(11,15,25,.16);
  --glass:rgba(255,236,214,.26);
  --orange:#FF7645;
  --amber:#FDBC57;
  --ease-out:cubic-bezier(.16,1,.3,1);
}
*{ box-sizing:border-box; margin:0; padding:0; }
html{ -webkit-text-size-adjust:100%; }
body{
  min-height:100vh;
  background:var(--orange);
  color:var(--ink);
  font-family:Inter, "Helvetica Neue", Helvetica, Arial, sans-serif;
  font-weight:300;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  overflow-x:hidden;
}

/* ---------- пространство: тёплый свет сверху, глубина к краям ---------- */
.stage{ position:fixed; inset:0; z-index:0; overflow:hidden;
  --c1:#FDBC57; --c2:#FF8A4A; --c3:#FF7645; --c4:rgba(232,84,40,.55);
  background:
    radial-gradient(70% 55% at 50% 30%, var(--c1) 0%, transparent 70%),
    radial-gradient(120% 90% at 50% 110%, var(--c4) 0%, transparent 60%),
    linear-gradient(180deg, var(--c1) 0%, var(--c2) 45%, var(--c3) 100%);
}
.stage canvas{ position:absolute; inset:0; width:100%; height:100%; display:block; opacity:0; transition:opacity 1.2s var(--ease-out); }
.stage canvas.on{ opacity:1; }
/* лёгкое зерно, чтобы градиент не был «пластиковым» */
.stage::after{
  content:""; position:absolute; inset:-50%; opacity:.08; mix-blend-mode:multiply; pointer-events:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='140' height='140' filter='url(%23n)' opacity='.6'/></svg>");
}

/* ---------- первый экран: только логотип ---------- */
.hero{ position:relative; z-index:2; height:100vh; height:100svh; display:grid; place-items:center; pointer-events:none; }
.hero img{ width:min(403px, 72vw); height:auto; filter:drop-shadow(0 6px 30px rgba(120,40,0,.25)); }

/* ---------- контент глав ---------- */
.content{ position:relative; z-index:2; padding:8vh 0 30vh; }
.chapter{
  width:min(864px, calc(100% - clamp(16px, 9vw, 150px) - 96px));
  margin:0 0 0 clamp(16px, 9vw, 150px);
  padding:16vh 0 4vh;
}

.num{ display:block; margin-bottom:22px; font-size:13px; font-weight:400; letter-spacing:.06em; color:rgba(255,255,255,.72); }

.doc h1{ overflow-wrap:break-word; font-weight:700; font-size:clamp(44px, 6vw, 84px); line-height:.98; letter-spacing:-.04em; text-wrap:balance; }
.doc h2{ margin-top:22px; font-weight:700; font-size:28px; line-height:1.35; letter-spacing:-.015em; color:var(--ink-soft); text-wrap:balance; }
.doc h3{ margin-top:clamp(56px, 9vh, 96px); font-weight:700; font-size:24px; line-height:1.2; letter-spacing:-.03em; text-wrap:balance; }
.doc h4{ margin-top:40px; font-weight:700; font-size:20px; line-height:1.3; letter-spacing:-.014em; }
.doc p, .doc li, .doc td, .doc th{ font-size:clamp(16px, 1.2vw, 18px); line-height:1.6; letter-spacing:-.006em; text-wrap:pretty; }
.doc > * + *, .doc .card > * + *{ margin-top:14px; }
.doc h1 + *{ margin-top:22px; }
.doc h3 + *, .doc h4 + *{ margin-top:12px; }
.doc h3 + h4{ margin-top:32px; }
/* «лимиты»: пункты плотнее */
.chapter[data-ch="08-limits"] .doc h4{ margin-top:28px; }
.chapter[data-ch="08-limits"] .doc h3 + h4{ margin-top:24px; }
.doc strong, .doc b{ font-weight:600; }
.doc b.key{ font-weight:600; }
.doc a{ color:inherit; text-underline-offset:3px; }
.doc s{ color:var(--ink-faint); }
.doc s.lore{ font-family:"LORE Cyrillic", Inter, sans-serif; font-size:1.05em; color:var(--ink); text-decoration-color:var(--ink); }
.doc hr{ display:none; }
.doc ul, .doc ol{ padding-left:1.2em; }
.doc li + li{ margin-top:6px; }
.doc li::marker{ color:var(--ink-faint); }
.doc blockquote{ padding:14px 18px; border-radius:16px; background:var(--glass); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px); }
.doc blockquote p{ font-size:clamp(15px, 1.1vw, 17px); }
.doc .tag{ display:inline-block; margin-left:6px; padding:0 9px; border-radius:999px; box-shadow:inset 0 0 0 1px var(--rule); font-size:12px; font-weight:500; line-height:1.8; color:var(--ink-soft); white-space:nowrap; vertical-align:2px; }
.doc .callout{ margin-top:28px; padding:24px 28px; border-radius:18px; font-weight:500;
  background:var(--glass); -webkit-backdrop-filter:blur(16px); backdrop-filter:blur(16px);
  position:relative; box-shadow:0 0 24px 3px rgba(255,58,30,.36), 0 8px 24px rgba(160,30,0,.12);
  transition:transform .5s var(--ease-out), box-shadow .5s var(--ease-out); }
.doc .callout:hover{ transform:translateY(-2px); box-shadow:0 0 32px 5px rgba(255,58,30,.44), 0 14px 32px rgba(160,30,0,.16); }

.doc .warn, .doc .note{ padding-left:16px; border-left:2px solid var(--ink); }
.doc .fact{ position:relative; padding-left:18px; }
.doc .fact::before{ content:""; position:absolute; left:0; top:2px; bottom:2px; width:2px; border-radius:2px; background:#FF5A14; box-shadow:0 0 8px 1px rgba(255,90,20,.75); }
.doc .note, .doc .when-not{ color:var(--ink-soft); }
.doc .aside{ color:rgba(255,255,255,.72); }
.doc aside.draft, .doc p.draft{ display:block; padding:12px 16px; border-radius:12px; border:1px dashed var(--ink-faint); color:var(--ink-soft); font-size:14px; font-style:italic; }
.doc aside.draft::before{ content:"черновик · "; font-style:normal; font-weight:400; }
.doc .draft-inline{ color:var(--ink-soft); font-style:italic; }
.doc .cards, .doc .groups{ display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:14px; }
.doc > .groups{ margin-top:28px; }
@media (min-width: 1440px){ .doc .cards{ grid-template-columns:repeat(4, minmax(0, 1fr)); } }
@media (min-width: 900px){ .doc .cards:has(> .card:nth-child(3):last-child){ grid-template-columns:repeat(3, minmax(0, 1fr)); } }
@media (max-width: 560px){ .doc .cards, .doc .groups{ grid-template-columns:1fr; } }
.doc .card, .doc .groups > div{ padding:20px; border-radius:18px; background:var(--glass); -webkit-backdrop-filter:blur(16px); backdrop-filter:blur(16px); }
.doc .card h3{ margin:0; padding:0; border:0; font-size:22px; font-weight:700; letter-spacing:-.02em; text-transform:lowercase; }
.doc .card h4{ margin:0; font-size:20px; }
.doc .card p, .doc .card li{ font-size:15px; }
.doc .groups > div{ font-size:15px; line-height:1.6; }
.doc .groups b{ display:block; margin-bottom:14px; font-size:22px; font-weight:700; letter-spacing:-.02em; line-height:1.2; text-transform:lowercase; }
.doc .compare{ display:grid; grid-template-columns:1fr 1fr; gap:18px; }
.doc .compare > div{ padding:16px 18px; border-radius:16px; background:var(--glass); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px); font-size:16px; line-height:1.55; }
.doc .compare .good{ box-shadow:0 0 26px 3px rgba(40,200,90,.32), 0 8px 24px rgba(0,90,30,.10); }

.doc .template > div{ padding:4px 0; font-size:clamp(16px, 1.2vw, 18px); line-height:1.6; letter-spacing:-.006em; }
.doc .template > .gap{ margin-top:20px; }
.doc .template > .gap--l{ margin-top:28px; }
.doc .template ul{ margin:10px 0 0; }
.doc .template{ padding:22px 24px; border-radius:18px; background:var(--glass); -webkit-backdrop-filter:blur(16px); backdrop-filter:blur(16px); }
/* «от себя»: заголовок блока отдельной строкой, под ним текст, между блоками воздух */
.doc .personal > p + p{ margin-top:6px; }
.doc .personal > p.ptitle + p{ margin-top:6px; }
.doc .personal > p.ptitle:not(:first-child){ margin-top:36px; }
.doc .callout + .personal{ margin-top:36px; }
.doc .table-wrap{ overflow-x:auto; padding:6px 20px; border-radius:18px; background:var(--glass); -webkit-backdrop-filter:blur(16px); backdrop-filter:blur(16px); }
.doc .table-wrap td, .doc .table-wrap th{ font-size:clamp(14px, 1.05vw, 16px); }
.doc .table-wrap tr + tr > *{ box-shadow:inset 0 1px 0 var(--rule); }
.doc table{ width:100%; border-collapse:collapse; }
.doc th, .doc td{ padding:10px 16px 10px 0; text-align:left; vertical-align:top; }
.doc th{ border-top:0; font-size:12.5px; letter-spacing:.045em; color:var(--ink-soft); font-weight:400; }
.doc .versions{ margin-top:22px; }
.chapter--final{ width:100%; margin:0; padding:0; min-height:100vh; min-height:100svh; display:grid; place-items:center; text-align:center; }
.chapter--final .doc{ width:100%; }
.doc .thanks{ display:grid; place-content:center; justify-items:center; text-align:center; }
.doc .thanks__title{ font-size:clamp(72px, 12vw, 180px); }
.doc .thanks__note{ color:var(--ink-soft); font-size:13px; }
.doc .thanks__note.typing::after{ content:""; display:inline-block; width:1px; height:1.1em; margin-left:2px; vertical-align:-.15em; background:currentColor; animation:caret 1s steps(1) infinite; }
@keyframes caret{ 50%{ opacity:0; } }

/* ---------- навигация справа: стеклянная капсула с точками и «жидкой» каплей текущей главы ---------- */
:root{ --accent:#E8501C; }
.rail{ position:fixed; z-index:20; right:clamp(14px, 2.2vw, 36px); top:50%; transform:translateY(-50%);
  display:flex; flex-direction:column; align-items:center; gap:10px;
  opacity:0; pointer-events:none; transition:opacity .6s var(--ease-out); }
.rail.on{ opacity:1; pointer-events:auto; }
.glass{ background:rgba(255,255,255,.3); -webkit-backdrop-filter:blur(18px) saturate(1.5); backdrop-filter:blur(18px) saturate(1.5);
  box-shadow:inset 0 0 0 .5px rgba(255,255,255,.7), inset 0 1px 0 rgba(255,255,255,.6), 0 8px 24px rgba(0,0,0,.07); }
.burger{ width:34px; height:34px; border:0; background:none; cursor:pointer; color:#fff; display:grid; place-items:center;
  filter:drop-shadow(0 0 4px rgba(255,255,255,.7)) drop-shadow(0 1px 3px rgba(0,0,0,.18)); transition:transform .3s var(--ease-out); }
.burger:hover{ transform:scale(1.1); }
.burger svg{ width:18px; height:18px; }
.pill{ position:relative; padding:4px 0; width:24px; }
.dots{ list-style:none; display:flex; flex-direction:column; align-items:center; }
.dot{ position:relative; display:grid; place-items:center; width:24px; height:18px; border:0; background:none; cursor:pointer; }
.dot::before{ content:""; width:7px; height:7px; border-radius:50%; background:rgba(255,255,255,.38);
  -webkit-backdrop-filter:blur(6px) saturate(1.4); backdrop-filter:blur(6px) saturate(1.4);
  transition:background .3s, transform .3s var(--ease-out); }
.dot:hover::before{ background:rgba(255,255,255,.7); transform:scale(1.25); }
.dot span{ position:absolute; right:34px; top:50%; transform:translate(4px,-50%); white-space:nowrap; font:400 13px/1 Inter, sans-serif; color:var(--ink);
  padding:7px 11px; border-radius:999px; opacity:0; pointer-events:none; transition:opacity .25s, transform .25s var(--ease-out); }
.dot:hover span, .dot:focus-visible span{ opacity:1; transform:translate(0,-50%); }
/* капля: тянется от точки к точке и догоняет сама себя, как жидкость */
.drop{ position:absolute; left:50%; top:0; width:8px; height:8px; margin-left:-4px; border-radius:999px; pointer-events:none;
  background:#fff; box-shadow:0 0 10px 3px var(--accent), 0 0 3px 1px var(--accent); will-change:transform,height; }
.toc{ position:fixed; z-index:30; right:clamp(14px, 2.2vw, 36px); top:50%; width:min(340px, calc(100vw - 28px)); max-height:80vh; overflow:auto;
  transform:translate(8px,-50%) scale(.98); transform-origin:right center; opacity:0; visibility:hidden;
  padding:10px; border-radius:24px; background:var(--panel, rgba(255,255,255,.5)); -webkit-backdrop-filter:blur(26px) saturate(1.6); backdrop-filter:blur(26px) saturate(1.6);
  box-shadow:0 24px 60px rgba(0,0,0,.12), inset 0 0 0 .5px rgba(255,255,255,.8);
  transition:opacity .35s var(--ease-out), transform .35s var(--ease-out), visibility 0s .35s; }
.toc.is-open{ opacity:1; visibility:visible; transform:translate(0,-50%); transition:opacity .35s var(--ease-out), transform .35s var(--ease-out); }
.toc ol{ list-style:none; }
.toc button{ display:flex; gap:12px; align-items:baseline; width:100%; padding:9px 12px; border:0; border-radius:14px; background:none; cursor:pointer; text-align:left;
  font:400 15px/1.3 Inter, sans-serif; color:var(--ink); transition:background .2s; }
.toc button:hover{ background:rgba(128,128,128,.18); }
.toc button.is-active{ font-weight:700; background:rgba(128,128,128,.26); }
.toc small{ font-size:12px; min-width:20px; }

@media (max-width: 760px){
  .rail{ right:6px; gap:8px; }
  .burger{ width:30px; height:30px; }
  .pill{ width:20px; padding:5px 0; }
  .dot{ width:20px; height:15px; }
  .dot span{ display:none; }
  .toc{ right:14px; }
  .chapter{ width:calc(100% - 60px); margin:0 0 0 16px; padding-top:12vh; }
  .chapter--final{ width:100%; margin:0; padding:0; }
  .doc .compare{ grid-template-columns:1fr; }
}
@media (prefers-reduced-motion: reduce){
  .stage canvas{ transition:none; }
}
</style>
</head>
<body>

<div class="stage"><canvas id="gl" aria-hidden="true"></canvas></div>

<header class="hero">
  <img src="claude-logo.svg" alt="Claude" width="403" height="87">
</header>

<main class="content" id="content"></main>

<nav class="rail" id="rail" aria-label="Главы">
  <button class="burger" id="burger" type="button" aria-label="Содержание" aria-expanded="false">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"><path d="M2 4h12M2 8h12M2 12h12"/></svg>
  </button>
  <div class="pill"><ol class="dots" id="dots"></ol><i class="drop" id="drop"></i></div>
</nav>
<div class="toc" id="toc" role="dialog" aria-label="Содержание"><ol id="tocList"></ol></div>

<script src="../vendor/marked.min.js"></script>
<script src="../vendor/three.min.js"></script>
<script src="figures.js"></script>
<script>
(function(){
  "use strict";

  // Главы — те же файлы, что и в основной версии. Текст не меняем.
  var FILES = [
    "../content/01-likbez.md", "../content/02-where.md", "../content/03-chrome.md", "../content/04-design.md",
    "../content/05-code.md", "../content/06-connectors.md", "../content/07-skills.md", "../content/08-limits.md",
    "../content/09-task.md", "../content/10-inspiration.md", "../content/11-personal.md", "../content/12-thanks.md"
  ];
  var gl = document.getElementById("gl"), content = document.getElementById("content");
  var pad = function(n){ return String(n).padStart(2, "0"); };
  function clamp(v, a, b){ return Math.min(b, Math.max(a, v)); }
  function smooth(t){ return t * t * (3 - 2 * t); }
  function esc(t){ return t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
  function ramp(p, a, b){ return smooth(clamp((p - a) / (b - a), 0, 1)); }

  // эмодзи в презентации не показываем; сами тексты глав не меняем
  var EMOJI = /(?:\p{Extended_Pictographic}|\p{Regional_Indicator})(?:\uFE0F|\u200D(?:\p{Extended_Pictographic})\uFE0F?)*\s?/gu;
  function stripEmoji(root){
    var w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT), n, list = [];
    while ((n = w.nextNode())) list.push(n);
    list.forEach(function(t){ var v = t.nodeValue.replace(EMOJI, "").replace(/\uFE0F/g, ""); if (v !== t.nodeValue) t.nodeValue = v; });
  }

  function render(md){
    md.forEach(function(text, i){
      var sec = document.createElement("section");
      sec.className = "chapter";
      sec.setAttribute("data-ch", (FILES[i].split("/").pop() || "").replace(".md", ""));
      var doc = document.createElement("article");
      doc.className = "doc";
      doc.innerHTML = marked.parse(text || "");
      // длинные заголовки вида «chat/chrome/design/code» переносим по косой черте, а не посреди слова
      doc.querySelectorAll("h1").forEach(function(h){
        if (h.children.length === 0 && h.textContent.indexOf("/") >= 0) h.innerHTML = h.textContent.split("/").map(esc).join("/<wbr>");
      });
      stripEmoji(doc);
      // «от себя»: абзац, целиком состоящий из жирного текста, — заголовок блока
      doc.querySelectorAll(".personal > p").forEach(function(p){
        var b = p.querySelector("strong, b");
        if (b && b.textContent.trim() === p.textContent.trim()) p.classList.add("ptitle");
      });
      doc.querySelectorAll("table").forEach(function(t){ var w = document.createElement("div"); w.className = "table-wrap"; t.parentNode.replaceChild(w, t); w.appendChild(t); });
      doc.querySelectorAll("a[href^='http']").forEach(function(a){ a.target = "_blank"; a.rel = "noopener"; });
      var last = i === FILES.length - 1;
      if (last) sec.classList.add("chapter--final");   // «thanks.» — без номера и вне навигации
      else {
        var num = document.createElement("span");
        num.className = "num";
        num.textContent = pad(i + 1) + " / " + pad(FILES.length - 1);
        sec.appendChild(num);
      }
      sec.appendChild(doc);
      content.appendChild(sec);
    });
  }

  // ---------- «thanks.»: подпись печатается, когда экран доезжает до неё ----------
  function typeThanks(){
    var note = content.querySelector(".thanks__note");
    if (!note || !("IntersectionObserver" in window) || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    var full = note.textContent, done = false;
    note.style.minHeight = note.offsetHeight + "px";
    note.textContent = "";
    new IntersectionObserver(function(entries, obs){
      if (done || !entries[0].isIntersecting) return;
      done = true; obs.disconnect();
      note.classList.add("typing");
      var n = 0;
      (function step(){
        note.textContent = full.slice(0, ++n);
        if (n < full.length) setTimeout(step, 35 + Math.random() * 35);
        else setTimeout(function(){ note.classList.remove("typing"); }, 2400);
      })();
    }, { threshold:1 }).observe(note);
  }

  // ---------- навигация: точки + содержание ----------
  var rail = document.getElementById("rail"), dots = document.getElementById("dots");
  var toc = document.getElementById("toc"), tocList = document.getElementById("tocList"), burger = document.getElementById("burger");
  var sections = [], active = -1;
  function buildNav(){
    sections = [].slice.call(content.querySelectorAll(".chapter:not(.chapter--final)"));
    sections.forEach(function(sec, i){
      var h1 = sec.querySelector("h1"), title = h1 ? h1.textContent.trim() : "Глава " + (i + 1);
      var li = document.createElement("li"), b = document.createElement("button");
      b.type = "button"; b.className = "dot"; b.setAttribute("aria-label", title);
      b.innerHTML = '<span class="glass">' + esc(title) + "</span>";
      b.addEventListener("click", function(){ go(i); });
      li.appendChild(b); dots.appendChild(li);
      var tl = document.createElement("li"), tb = document.createElement("button");
      tb.type = "button";
      tb.innerHTML = "<small>" + pad(i + 1) + "</small><span>" + esc(title) + "</span>";
      tb.addEventListener("click", function(){ closeToc(); go(i); });
      tl.appendChild(tb); tocList.appendChild(tl);
    });
  }
  // offsetTop считается от блока с главами, а не от страницы (над ним ещё экран с логотипом) — берём настоящую позицию
  function top(el){ return el.getBoundingClientRect().top + pageYOffset; }
  function go(i){ window.scrollTo({ top: top(sections[i]) + 2, behavior: "smooth" }); }
  function openToc(){ toc.classList.add("is-open"); burger.setAttribute("aria-expanded", "true"); }
  function closeToc(){ toc.classList.remove("is-open"); burger.setAttribute("aria-expanded", "false"); }
  burger.addEventListener("click", function(e){ e.stopPropagation(); toc.classList.contains("is-open") ? closeToc() : openToc(); });
  document.addEventListener("click", function(e){ if (!toc.contains(e.target)) closeToc(); });
  document.addEventListener("keydown", function(e){ if (e.key === "Escape") closeToc(); });
  var drop = document.getElementById("drop"), head = -1, tail = -1;
  function stepDrop(dt){
    if (active < 0 || !dots.children.length) return;
    var b = dots.children[active].firstChild, target = b.offsetTop + b.offsetHeight / 2;
    if (head < 0){ head = tail = target; }
    head += (target - head) * (1 - Math.exp(-dt * 16));   // голова быстрая
    tail += (target - tail) * (1 - Math.exp(-dt * 5));    // хвост тянется следом
    var top = Math.min(head, tail), len = Math.abs(head - tail);
    var w = 8 - Math.min(2.5, len * 0.05);                 // вытягиваясь, капля становится тоньше
    drop.style.height = (len + w) + "px";
    drop.style.width = w + "px"; drop.style.marginLeft = (-w / 2) + "px";
    drop.style.transform = "translateY(" + (top - w / 2) + "px)";
  }
  function markNav(y){
    rail.classList.toggle("on", y > innerHeight * 0.6);
    var cur = 0;
    for (var i = 0; i < sections.length; i++) if (top(sections[i]) <= y + innerHeight * 0.4) cur = i;
    if (cur === active) return;
    active = cur;
    [].forEach.call(dots.children, function(li, k){ li.firstChild.classList.toggle("is-active", k === cur); });
    [].forEach.call(tocList.children, function(li, k){ li.firstChild.classList.toggle("is-active", k === cur); });
  }

  // ---------- палитры: у каждой фигуры свой фон ----------
  // оранжевый и чёрный фон чередуются; фигуры по порядку: звезда, гантель, пушистая, петля в панцире,
  // кольцо из шаров, многолапая, облако
  var ORANGE = { bg: ["#FDBC57", "#FF8A4A", "#FF7645", "rgba(232,84,40,.55)"], bounce: "#C8502A", accent: "#E8501C" };
  // эксперимент: вместо лилового — чёрный; на нём фигуры чёрные, а текст белый
  var BLACK = { bg: ["#2A2A2A", "#141414", "#070707", "rgba(255,120,60,.10)"], bounce: "#2A2A2A", accent: "#FF6A2C", dark: 1 };
  var PALETTES = [ORANGE, BLACK, ORANGE, BLACK, ORANGE, BLACK, ORANGE];
  // откуда фигура въезжает (мировые единицы): справа, снизу, слева, сверху…
  // фигуры никогда не пересекают колонку текста: уходят вправо, новые приезжают справа, снизу или сверху
  var ENTRY = [[0, 0, 0], [0, -6.5, 0], [8, 0.5, 0], [0, 6.5, 0], [8, -0.5, 0], [0, -6.5, 0], [8, 0, 0]];
  function rgba(c){
    if (c[0] === "#") return [parseInt(c.substr(1, 2), 16), parseInt(c.substr(3, 2), 16), parseInt(c.substr(5, 2), 16), 1];
    var m = c.match(/[\d.]+/g); return [+m[0], +m[1], +m[2], +m[3]];
  }
  function mix(a, b, k){ var x = rgba(a), y = rgba(b); return [0, 1, 2, 3].map(function(i){ return x[i] + (y[i] - x[i]) * k; }); }
  function css(v){ return "rgba(" + Math.round(v[0]) + "," + Math.round(v[1]) + "," + Math.round(v[2]) + "," + v[3].toFixed(3) + ")"; }
  function hex(v){ return "#" + [0, 1, 2].map(function(i){ return ("0" + Math.round(v[i]).toString(16)).slice(-2); }).join(""); }
  var stage = document.querySelector(".stage"), theme = document.querySelector('meta[name="theme-color"]'), lastPal = "";
  function applyPalette(ka, kb, blend){
    var a = PALETTES[ka], b = PALETTES[kb];
    var key = ka + ">" + kb + ":" + blend.toFixed(3);
    if (key === lastPal) return;
    lastPal = key;
    for (var i = 0; i < 4; i++) stage.style.setProperty("--c" + (i + 1), css(mix(a.bg[i], b.bg[i], blend)));
    theme.setAttribute("content", hex(mix(a.bg[2], b.bg[2], blend)));
    document.documentElement.style.setProperty("--accent", hex(mix(a.accent, b.accent, blend)));
    var d = smooth(clamp(((a.dark || 0) + ((b.dark || 0) - (a.dark || 0)) * blend - 0.4) / 0.2, 0, 1)), root = document.documentElement.style;
    root.setProperty("--ink", hex(mix("#0B0F19", "#F5F2EE", d)));
    root.setProperty("--rule", css(mix("rgba(11,15,25,.16)", "rgba(255,255,255,.16)", d)));
    root.setProperty("--glass", css(mix("rgba(255,236,214,.26)", "rgba(255,255,255,.07)", d)));
    root.setProperty("--panel", css(mix("rgba(255,255,255,.5)", "rgba(28,28,28,.6)", d)));
    FIG.bounce(hex(mix(a.bounce, b.bounce, blend)));
  }

  // ---------- прокрутка: семь фигур, каждая со своим фоном держит целые главы ----------
  // Номера глав (с нуля, последняя — «thanks.»), с которых начинается каждый из 7 участков.
  // Фон меняется только на границе глав: когда заголовок новой главы доезжает до середины экрана.
  // Внутри участка прокрутка медленно поворачивает фигуру; у границы она уезжает, следующая въезжает.
  var CYCLES = PALETTES.length;
  var GROUP_START = [0, 1, 3, 5, 7, 8, 10];
  var ready = false, progress = 0, gAt = 0, gSeek = 0, last = performance.now();
  var palFrom = 0, palTo = 0, palT = 1, PAL_TIME = 0.45;   // быстрая смена фона по времени, а не по прокрутке
  function readScroll(){
    var max = document.documentElement.scrollHeight - innerHeight, y = pageYOffset;
    progress = max > 0 ? clamp(y / max, 0, 1) : 0;
    var all = content.querySelectorAll(".chapter");
    if (all.length > GROUP_START[CYCLES - 1]){
      // граница — номер главы у середины экрана (а не верхний отступ секции)
      var b = GROUP_START.map(function(ci, k){ return k ? Math.min(max, top(all[ci].firstElementChild || all[ci]) - innerHeight * 0.5) : 0; });
      b.push(Math.max(max, b[CYCLES - 1] + 1));
      var k = 0;
      while (k < CYCLES - 1 && y >= b[k + 1]) k++;
      gAt = k + clamp((y - b[k]) / Math.max(1, b[k + 1] - b[k]), 0, k < CYCLES - 1 ? 0.999 : 1);
    } else gAt = Math.min(CYCLES, progress * CYCLES);
    var want = Math.min(CYCLES - 1, Math.floor(gAt));
    if (want !== palTo){ palFrom = palT < 0.5 ? palFrom : palTo; palTo = want; palT = 0; }
    if (sections.length) markNav(y);
  }
  function frame(now){
    var dt = Math.min(0.1, (now - last) / 1000); last = now;
    if (ready){
      gSeek += (gAt - gSeek) * (1 - Math.exp(-dt * 6));   // мягко догоняем, без рывков
      var k = Math.min(CYCLES - 1, Math.floor(gSeek)), c = clamp(gSeek - k, 0, 1);
      if (gSeek >= CYCLES){ k = CYCLES - 1; c = 1; }
      var e = ENTRY[k], n = k < CYCLES - 1 ? ENTRY[k + 1] : [0, 0, 0];
      var inK = 1 - ramp(c, 0, 0.1), outK = ramp(c, 0.92, 1);
      FIG.place(e[0] * inK + 9 * outK * (k < CYCLES - 1 ? 1 : 0), e[1] * inK, 0);
      palT = Math.min(1, palT + dt / PAL_TIME);
      applyPalette(palFrom, palTo, smooth(palT));
      // первый экран: фигура крупно за логотипом; дальше отходит вправо, освобождая место тексту
      var past = ramp(pageYOffset / innerHeight, 0.2, 1);
      var wide = innerWidth > 900;
      FIG.shift(wide ? 0.27 * past : 0);
      gl.style.opacity = wide ? "" : String(1 - 0.55 * past);
      FIG.render(k, c, dt, 0.88 + 0.24 * past);
      stepDrop(dt);
    }
    requestAnimationFrame(frame);
  }
  window.addEventListener("scroll", readScroll, { passive: true });
  window.addEventListener("resize", readScroll);
  window.addEventListener("pointermove", function(e){
    if (ready) FIG.mouse(e.clientX / innerWidth * 2 - 1, e.clientY / innerHeight * 2 - 1);
  }, { passive: true });

  try { FIG.init(gl); ready = true; requestAnimationFrame(function(){ gl.classList.add("on"); }); }
  catch (e) { console.error(e); }

  Promise.all(FILES.map(function(f){
    return fetch(f).then(function(r){ return r.ok ? r.text() : ""; }).catch(function(){ return ""; });
  })).then(function(md){ render(md); typeThanks(); buildNav(); readScroll(); gSeek = gAt; palFrom = palTo; palT = 1; });

  readScroll();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
